name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Instalar dependências
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Formatação
        run: uv run ruff format --check

      - name: Testes
        run: uv run pytest
